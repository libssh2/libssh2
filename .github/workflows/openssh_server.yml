name: 'OpenSSH Server Container Image'

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  DO_NOT_TRACK: '1'

jobs:
  build-and-push:
    name: 'Image build and push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read   # To comply with https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
    # packages: write  # To create/update container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - shell: bash
        id: hash
        run: echo "hash=$(git rev-parse --short=20 HEAD:tests/openssh_server)" >> "$GITHUB_OUTPUT"

      - shell: bash
        id: poll
        continue-on-error: true
        env:
          HASH: '${{ steps.hash.outputs.hash }}'
        run: docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ci_tests_openssh_server:${HASH}"

      - name: 'install prereqs'
        if: ${{ steps.poll.outcome == 'failure' }}
        run: |
          sudo find /etc/apt/sources.list.d -type f -not -name 'ubuntu.sources' -delete -print
          sudo apt-get -o Dpkg::Use-Pty=0 update
          sudo apt-get -o Dpkg::Use-Pty=0 install \
            qemu-user

      # name: 'docker login (ghcr.io)'
      # if: ${{ steps.poll.outcome == 'failure' }}
      # env:
      #   GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      # run: echo "${GH_TOKEN}" | docker login -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin ghcr.io

      - name: 'build image'
        env:
          HASH: '${{ steps.hash.outputs.hash }}'
        run: |
          docker buildx build \
            --iidfile ~/image_id.txt \
            --label org.opencontainers.image.title=libssh2 \
            --label org.opencontainers.image.description='the SSH library' \
            --label org.opencontainers.image.licenses=BSD-3-Clause \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${HASH}" \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/libssh2/ci_tests_openssh_server:${HASH}" \
            ./tests/openssh_server  # --push

      - name: 'image info'
        run: docker inspect "$(cat ~/image_id.txt)"

      # name: 'docker logout (ghcr.io)'
      # if: ${{ always() && steps.poll.outcome == 'failure' }}
      # run: docker logout ghcr.io
